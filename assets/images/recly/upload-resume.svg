<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">업로드가 중간에 끊기면</title><desc id="desc">테스트에서 두 번째 파트의 청크 처리 중 503 오류를 반환한다. 첫 파트는 다시 보내지 않고 저장된 오프셋으로 세션을 조회해 두 번째 파트를 이어 보낸 뒤 메타데이터를 업로드한다.</desc><defs><marker id="a356AB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#356AB5"/></marker><marker id="a26765C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#26765C"/></marker><marker id="aB74C4C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B74C4C"/></marker><marker id="a62758B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#62758B"/></marker><marker id="a926719" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#926719"/></marker></defs><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="960" height="510" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="45" font-size="28" fill="#23364F" font-weight="700" text-anchor="start">업로드가 중간에 끊기면</text><text x="30" y="78" font-size="18" fill="#62758B" font-weight="400" text-anchor="start">두 번째 파트를 전송하다 503 응답을 받은 테스트 사례</text><text x="30" y="190" font-size="21" fill="#B74C4C" font-weight="700" text-anchor="start">첫 실행</text><text x="30" y="363" font-size="21" fill="#26765C" font-weight="700" text-anchor="start">재실행</text><rect x="180" y="144" width="226" height="86" rx="12" fill="#F6F8FB" stroke="#D9E1EB" stroke-width="1.5"/><text x="293" y="179" font-size="21" fill="#23364F" font-weight="700" text-anchor="middle">파트 1</text><text x="293" y="210" font-size="16" fill="#62758B" font-weight="400" text-anchor="middle">업로드 완료</text><polyline points="406,187 436,187" fill="none" stroke="#62758B" stroke-width="2" stroke-linejoin="round" marker-end="url(#a62758B)"/><rect x="442" y="144" width="226" height="86" rx="12" fill="#FFF7F6" stroke="#EDD0CD" stroke-width="1.5"/><text x="555" y="179" font-size="21" fill="#23364F" font-weight="700" text-anchor="middle">파트 2</text><text x="555" y="210" font-size="16" fill="#B74C4C" font-weight="400" text-anchor="middle">청크 전송 중 503</text><polyline points="668,187 698,187" fill="none" stroke="#62758B" stroke-width="2" stroke-linejoin="round" marker-end="url(#a62758B)" stroke-dasharray="6 5"/><rect x="704" y="144" width="226" height="86" rx="12" fill="#F6F8FB" stroke="#D9E1EB" stroke-width="1.5"/><text x="817" y="179" font-size="21" fill="#23364F" font-weight="700" text-anchor="middle">메타데이터</text><text x="817" y="210" font-size="16" fill="#62758B" font-weight="400" text-anchor="middle">아직 업로드하지 않음</text><polyline points="555,230 555,290" fill="none" stroke="#356AB5" stroke-width="2" stroke-linejoin="round" marker-end="url(#a356AB5)"/><text x="572" y="268" font-size="16" fill="#356AB5" font-weight="400" text-anchor="start">세션 주소·오프셋 저장</text><rect x="180" y="317" width="226" height="86" rx="12" fill="#F0F8F3" stroke="#CADFD3" stroke-width="1.5"/><text x="293" y="352" font-size="21" fill="#23364F" font-weight="700" text-anchor="middle">파트 1</text><text x="293" y="383" font-size="16" fill="#26765C" font-weight="400" text-anchor="middle">기존 파일 확인 → 건너뜀</text><polyline points="406,360 436,360" fill="none" stroke="#26765C" stroke-width="2" stroke-linejoin="round" marker-end="url(#a26765C)"/><rect x="442" y="317" width="226" height="86" rx="12" fill="#F0F8F3" stroke="#CADFD3" stroke-width="1.5"/><text x="555" y="352" font-size="21" fill="#23364F" font-weight="700" text-anchor="middle">파트 2</text><text x="555" y="383" font-size="16" fill="#26765C" font-weight="400" text-anchor="middle">세션 조회 → 이어서 업로드</text><polyline points="668,360 698,360" fill="none" stroke="#26765C" stroke-width="2" stroke-linejoin="round" marker-end="url(#a26765C)"/><rect x="704" y="317" width="226" height="86" rx="12" fill="#F0F8F3" stroke="#CADFD3" stroke-width="1.5"/><text x="817" y="352" font-size="21" fill="#23364F" font-weight="700" text-anchor="middle">메타데이터</text><text x="817" y="383" font-size="16" fill="#26765C" font-weight="400" text-anchor="middle">파트 완료 후 업로드</text><text x="30" y="470" font-size="17" fill="#62758B" font-weight="400" text-anchor="start">별도 경우: 세션이 만료되면 새로 시작하고, 원격 폴더가 사라졌으면 다시 만든다.</text></g></svg>