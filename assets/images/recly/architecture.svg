<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1030" viewBox="0 0 1480 1030" role="img" aria-labelledby="title desc"><title id="title">Recly architecture</title><desc id="desc">워치의 녹음은 폰으로 전달되고, 각 폰과 데스크톱의 공통 코어가 사용자 Drive 업로드, 선택적 전사 및 웹훅을 실행한다. 사용자의 AI는 Drive의 전사 결과를 읽어 노트를 만든다.</desc><defs><marker id="a356AB5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#356AB5"/></marker><marker id="a368369" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#368369"/></marker><marker id="a8764B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8764B2"/></marker><marker id="a62758F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#62758F"/></marker></defs><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1480" height="1030" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="45" y="53" font-size="15" fill="#61728B" font-weight="700" text-anchor="start">RECLY / ARCHITECTURE</text><text x="45" y="99" font-size="34" fill="#172B4D" font-weight="700" text-anchor="start">Recly 아키텍처</text><text x="45" y="135" font-size="19" fill="#61728B" font-weight="400" text-anchor="start">녹음 파일을 Drive에 올리고 전사한 뒤, 평소 쓰는 AI에서 활용하는 구조</text><rect x="40" y="175" width="900" height="565" rx="22" fill="#F5F8FC" stroke="#D8E2F0" stroke-width="1.5"/><text x="64" y="209" font-size="19" fill="#244F88" font-weight="700" text-anchor="start">01   사용자 기기 · Recly 앱</text><text x="64" y="237" font-size="16" fill="#61728B" font-weight="400" text-anchor="start">자체 백엔드 없이 실행 · 워치의 녹음은 짝지은 폰이 이어서 처리</text><rect x="65" y="264" width="225" height="143" rx="16" fill="#ffffff" stroke="#D8DFEA" stroke-width="1.5"/><g transform="translate(83,281)" fill="none" stroke="#356AB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="19" y="2" width="18" height="12" rx="3"/><rect x="19" y="42" width="18" height="12" rx="3"/><rect x="10" y="12" width="36" height="32" rx="9"/><circle cx="28" cy="28" r="6"/></g><text x="150" y="307" font-size="21" fill="#172B4D" font-weight="700" text-anchor="start">워치</text><text x="83" y="356" font-size="16" fill="#61728B" font-weight="400" text-anchor="start">Galaxy Watch · Apple Watch</text><rect x="375" y="264" width="245" height="143" rx="16" fill="#ffffff" stroke="#D8DFEA" stroke-width="1.5"/><g transform="translate(393,281)" fill="none" stroke="#356AB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="3" width="30" height="50" rx="6"/><path d="M23 9h10M25 46h6"/><circle cx="28" cy="28" r="5"/></g><text x="460" y="307" font-size="21" fill="#172B4D" font-weight="700" text-anchor="start">폰</text><text x="393" y="356" font-size="16" fill="#61728B" font-weight="400" text-anchor="start">Android · iPhone</text><rect x="665" y="264" width="245" height="143" rx="16" fill="#ffffff" stroke="#D8DFEA" stroke-width="1.5"/><g transform="translate(683,281)" fill="none" stroke="#356AB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="50" height="33" rx="4"/><path d="M28 40v10M16 50h24M17 24h4l3-7 5 15 4-11h6"/></g><text x="750" y="307" font-size="21" fill="#172B4D" font-weight="700" text-anchor="start">데스크톱</text><text x="683" y="356" font-size="16" fill="#61728B" font-weight="400" text-anchor="start">macOS · Windows</text><polyline points="290,320 375,320" fill="none" stroke="#356AB5" stroke-width="2" stroke-linejoin="round" marker-end="url(#a356AB5)"/><text x="332" y="302" font-size="14" fill="#356AB5" font-weight="400" text-anchor="middle">파일 전달</text><text x="332" y="344" font-size="13" fill="#61728B" font-weight="400" text-anchor="middle">검증·ACK</text><polyline points="498,407 498,461" fill="none" stroke="#356AB5" stroke-width="2" stroke-linejoin="round" marker-end="url(#a356AB5)"/><polyline points="788,407 788,461" fill="none" stroke="#356AB5" stroke-width="2" stroke-linejoin="round" marker-end="url(#a356AB5)"/><rect x="65" y="461" width="845" height="210" rx="16" fill="#FFFFFF" stroke="#9DB9E0" stroke-width="1.5"/><g transform="translate(85,480)" fill="none" stroke="#356AB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="32" height="32" rx="5"/><path d="M21 2v10M35 2v10M21 44v10M35 44v10M2 21h10M2 35h10M44 21h10M44 35h10M21 23l-4 5 4 5M35 23l4 5-4 5"/></g><text x="159" y="508" font-size="23" fill="#172B4D" font-weight="700" text-anchor="start">Kotlin Multiplatform · 공통 코어</text><text x="159" y="537" font-size="17" fill="#61728B" font-weight="400" text-anchor="start">각 폰·데스크톱에 포함되어 실행되는 라이브러리</text><rect x="87" y="558" width="248" height="88" rx="10" fill="#EFF5FC" stroke="#EFF5FC" stroke-width="1.5"/><text x="102" y="589" font-size="18" fill="#244F88" font-weight="700" text-anchor="start">워크플로우 실행</text><text x="102" y="619" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">업로드 → 선택적 전사·웹훅</text><rect x="354" y="558" width="248" height="88" rx="10" fill="#EFF5FC" stroke="#EFF5FC" stroke-width="1.5"/><text x="369" y="589" font-size="18" fill="#244F88" font-weight="700" text-anchor="start">작업 큐 · 상태 저장</text><text x="369" y="619" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">SQLDelight · 실패 단계 재시도</text><rect x="621" y="558" width="267" height="88" rx="10" fill="#EFF5FC" stroke="#EFF5FC" stroke-width="1.5"/><text x="636" y="589" font-size="18" fill="#244F88" font-weight="700" text-anchor="start">외부 서비스 어댑터</text><text x="636" y="619" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">Drive · 전사 제공자 · 웹훅</text><text x="65" y="710" font-size="16" fill="#61728B" font-weight="400" text-anchor="start">플랫폼별 구현: 오디오 캡처 · 워치 전송 · OS 스케줄러 · 인증 · UI</text><text x="985" y="209" font-size="19" fill="#276E5A" font-weight="700" text-anchor="start">02   사용자가 연결한 서비스</text><rect x="985" y="264" width="450" height="140" rx="16" fill="#F5FAF7" stroke="#C8DFD3" stroke-width="1.5"/><g transform="translate(1003,282)" fill="none" stroke="#368369" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5h16l17 30-8 14H11L3 35z"/><path d="M20 5l17 30H3M36 5L11 49M37 35l8 14"/></g><text x="1076" y="310" font-size="23" fill="#225A48" font-weight="700" text-anchor="start">Google Drive</text><text x="1008" y="352" font-size="17" fill="#476C5F" font-weight="400" text-anchor="start">원본 오디오 · 메타데이터 · 전사 결과</text><text x="1008" y="379" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">사용자 계정의 파일 저장소</text><rect x="985" y="461" width="450" height="140" rx="16" fill="#F5FAF7" stroke="#C8DFD3" stroke-width="1.5"/><g transform="translate(1003,479)" fill="none" stroke="#368369" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 23v10M14 15v26M23 7v42M32 18v20M41 12v32M50 22v12"/></g><text x="1076" y="507" font-size="23" fill="#225A48" font-weight="700" text-anchor="start">전사 API</text><text x="1008" y="549" font-size="17" fill="#476C5F" font-weight="400" text-anchor="start">오디오 전송 ↔ 전사 결과</text><text x="1008" y="576" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">선택한 제공자 · 사용자 API 키</text><rect x="985" y="635" width="450" height="140" rx="16" fill="#F5FAF7" stroke="#C8DFD3" stroke-width="1.5"/><g transform="translate(1003,653)" fill="none" stroke="#368369" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="37" r="9"/><circle cx="40" cy="37" r="9"/><circle cx="28" cy="13" r="9"/><path d="M15 37l13-24M28 13l12 24M15 37h25"/></g><text x="1076" y="681" font-size="23" fill="#225A48" font-weight="700" text-anchor="start">웹훅</text><text x="1008" y="723" font-size="17" fill="#476C5F" font-weight="400" text-anchor="start">메타데이터 · Drive 링크 전달</text><text x="1008" y="750" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">선택적 후속 자동화</text><polyline points="910,495 958,495 958,334 985,334" fill="none" stroke="#368369" stroke-width="2" stroke-linejoin="round" marker-end="url(#a368369)"/><text x="828" y="449" font-size="14" fill="#368369" font-weight="400" text-anchor="start">파일 저장</text><polyline points="910,531 985,531" fill="none" stroke="#368369" stroke-width="2" stroke-linejoin="round" marker-end="url(#a368369)" marker-start="url(#a368369)"/><polyline points="910,613 963,613 963,705 985,705" fill="none" stroke="#368369" stroke-width="2" stroke-linejoin="round" marker-end="url(#a368369)" stroke-dasharray="7 5"/><rect x="40" y="809" width="1395" height="162" rx="20" fill="#FAF7FF" stroke="#DBD0EE" stroke-width="1.5"/><text x="65" y="842" font-size="18" fill="#72549D" font-weight="700" text-anchor="start">03   사용자의 AI · Recly 밖에서 활용</text><g transform="translate(68,870)" fill="none" stroke="#8764B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M28 3l6 18 19 7-19 7-6 18-7-18-18-7 18-7z"/></g><text x="140" y="895" font-size="23" fill="#5C3F83" font-weight="700" text-anchor="start">평소 쓰는 AI</text><text x="140" y="924" font-size="17" fill="#75638F" font-weight="400" text-anchor="start">Claude · ChatGPT · Codex 등</text><polyline points="475,902 590,902" fill="none" stroke="#8764B2" stroke-width="2" stroke-linejoin="round" marker-end="url(#a8764B2)"/><text x="532" y="883" font-size="14" fill="#8764B2" font-weight="400" text-anchor="middle">스킬·지침</text><g transform="translate(616,873)" fill="none" stroke="#8764B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3h23l10 11v39H12zM35 3v12h10M20 25h17M20 34h17M20 43h10"/></g><text x="688" y="896" font-size="23" fill="#5C3F83" font-weight="700" text-anchor="start">회의록 · 결정 기록 · 후속 작업</text><text x="688" y="925" font-size="17" fill="#75638F" font-weight="400" text-anchor="start">사용자의 형식과 작업 맥락에 맞춰 Notion 등에 정리</text><polyline points="1435,335 1455,335 1455,793 350,793 350,865" fill="none" stroke="#8764B2" stroke-width="2" stroke-linejoin="round" marker-end="url(#a8764B2)" stroke-dasharray="7 5"/><text x="635" y="786" font-size="14" fill="#8764B2" font-weight="400" text-anchor="start">AI가 Drive의 전사 결과를 읽음</text><text x="45" y="1005" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">실선: 파일·API 처리     점선: 선택적 연동 / 외부 AI 활용</text><text x="941" y="1005" font-size="15" fill="#61728B" font-weight="400" text-anchor="start">전사는 업로드 이후 실행 · 요약은 앱 밖에서</text></g></svg>